<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>MTG Life Tracker</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #111;
            color: white;
            font-family: Arial, sans-serif;
            min-height: 100vh;
        }

        /* =====================================================
           NAVIGATION
           ===================================================== */

        #page-navigator {
            margin: 10px;
        }

        #page-navigator select {
            padding: 8px;
            font-size: 16px;
            border-radius: 6px;
        }


        /* =====================================================
           HEADINGS
           ===================================================== */

        h1 {
            text-align: center;
            margin: 15px 0;
            font-size: 28px;
        }

        h2 {
            text-align: center;
        }


        /* =====================================================
           GAME SETUP
           ===================================================== */

        #game-setup {
            max-width: 500px;
            margin: 30px auto;
            padding: 20px;

            background: #222;

            border-radius: 15px;
            border: 2px solid #444;
        }

        #player-selects {
            display: flex;
            flex-direction: column;
            gap: 10px;

            margin: 20px 0;
        }

        .player-select-row {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .player-select-row label {
            width: 80px;
            font-size: 18px;
        }

        .player-select-row select {
            flex: 1;

            padding: 10px;

            font-size: 18px;

            border-radius: 8px;
            border: none;
        }

        #start-game {
            display: block;

            margin: 20px auto 0;

            padding: 12px 30px;

            border: none;
            border-radius: 10px;

            background: #239b56;

            color: white;

            font-size: 20px;
            font-weight: bold;

            cursor: pointer;
        }

        #start-game:active {
            transform: scale(0.95);
        }


        /* =====================================================
           PLAYERS
           ===================================================== */

        #players {
            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 10px;

            padding: 10px;

            max-width: 900px;

            margin: auto;
        }

        .player {
            min-height: 40vh;

            border: 3px solid var(--player-color);

            border-radius: 15px;

            padding: 15px;

            display: flex;

            flex-direction: column;

            justify-content: space-between;

            align-items: center;

            background: #222;
        }

        .player-name {
            font-size: 28px;
            font-weight: bold;
        }

        .life {
            font-size: 90px;
            font-weight: bold;

            color: var(--player-color);
        }


        /* =====================================================
           BUTTONS
           ===================================================== */

        .buttons {
            width: 100%;

            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 8px;
        }

        button {
            border: none;

            border-radius: 10px;

            padding: 15px;

            color: white;

            font-size: 24px;

            font-weight: bold;

            cursor: pointer;
        }

        button:active {
            transform: scale(0.95);
        }

        .minus {
            background: #a93226;
        }

        .plus {
            background: #239b56;
        }


        /* =====================================================
           RESET
           ===================================================== */

        #reset {
            display: block;

            margin: 10px auto 20px;

            background: #555;

            padding: 12px 30px;

            font-size: 18px;
        }


        /* =====================================================
           MOBILE
           ===================================================== */

        @media (max-width: 600px) {

            #players {
                gap: 6px;
                padding: 6px;
            }

            .player {
                min-height: 40vh;
                padding: 12px;
            }

            .player-name {
                font-size: 20px;
            }

            .life {
                font-size: 60px;
            }

            button {
                padding: 12px;
                font-size: 20px;
            }

        }

    </style>
</head>


<body>


<!-- =========================================================
     PAGE NAVIGATION
     ========================================================= -->

<div id="page-navigator">

    <select
        name="page-navigator"
        onchange="location = this.value;"
    >

        <option value="" selected disabled>
            Choose a page...
        </option>

        <option value="http://localhost:8000/">
            Home Page
        </option>

        <option value="http://localhost:8000/create_player/">
            Create Player
        </option>

        <option value="http://localhost:8000/leaderboard/">
            Leaderboard
        </option>

    </select>

</div>


<!-- =========================================================
     TITLE
     ========================================================= -->

<h1>
    MTG Life Tracker
</h1>


<!-- =========================================================
     GAME SETUP
     ========================================================= -->

<div id="game-setup">

    <h2>
        Choose Players
    </h2>

    <div id="player-selects">
        <!-- JavaScript creates the dropdowns here -->
    </div>

    <button id="start-game">
        Start Game
    </button>

</div>


<!-- =========================================================
     ACTUAL GAME
     ========================================================= -->

<div
    id="game"
    style="display: none;"
>

    <div id="players"></div>

    <button id="reset">
        Reset Game
    </button>

</div>


<script>


// =============================================================
// DATABASE PLAYERS
// =============================================================
//
// FastAPI/Jinja puts your PostgreSQL players here.
//
// For example:
//
// [
//     {
//         "id": 1,
//         "name": "Alice",
//         "color": "#e74c3c"
//     },
//     {
//         "id": 2,
//         "name": "Bob",
//         "color": "#3498db"
//     }
// ]
//
// =============================================================

const allPlayers = {{ players | tojson }};


// =============================================================
// CURRENT GAME
// =============================================================
//
// This starts empty.
//
// Once the user chooses players and presses
// "Start Game", this array gets filled.
//
// =============================================================

let players = [];


// =============================================================
// CREATE PLAYER DROPDOWNS
// =============================================================

const playerSelects =
    document.getElementById("player-selects");


for (let i = 0; i < 4; i++) {

    // Create a row
    const row =
        document.createElement("div");

    row.className =
        "player-select-row";


    // Create label
    const label =
        document.createElement("label");

    label.textContent =
        `Player ${i + 1}:`;


    // Create select
    const select =
        document.createElement("select");


    // Give the select an ID
    select.id =
        `player-select-${i}`;


    // First/default option
    const defaultOption =
        document.createElement("option");

    defaultOption.value = "";

    defaultOption.textContent =
        "Choose player...";

    defaultOption.selected = true;

    select.appendChild(defaultOption);


    // Add all players from PostgreSQL
    allPlayers.forEach(player => {

        const option =
            document.createElement("option");

        // Database ID
        option.value =
            player.uid;

        // Name shown to user
        option.textContent =
            player.username;

        select.appendChild(option);

    });


    // Add label and select to row
    row.appendChild(label);

    row.appendChild(select);


    // Add row to page
    playerSelects.appendChild(row);

}


// =============================================================
// CHECK FOR DUPLICATE PLAYERS
// =============================================================

function hasDuplicatePlayers() {

    const selects =
        document.querySelectorAll(
            "#player-selects select"
        );


    const selectedIds = [];


    selects.forEach(select => {

        if (select.value !== "") {

            selectedIds.push(
                select.value
            );

        }

    });


    return (
        new Set(selectedIds).size
        !== selectedIds.length
    );
}


// =============================================================
// START GAME
// =============================================================

document
    .getElementById("start-game")
    .addEventListener("click", function() {


        // -----------------------------------------------------
        // Check for duplicate players
        // -----------------------------------------------------

        if (hasDuplicatePlayers()) {

            alert(
                "You cannot select the same player twice."
            );

            return;
        }


        // -----------------------------------------------------
        // Start with an empty game
        // -----------------------------------------------------

        players = [];


        // -----------------------------------------------------
        // Get all dropdowns
        // -----------------------------------------------------

        const selects =
            document.querySelectorAll(
                "#player-selects select"
            );


        // -----------------------------------------------------
        // Get selected players
        // -----------------------------------------------------

        selects.forEach(select => {

            if (select.value === "") {
                return;
            }


            // Convert database ID from string to number
            const playerId =
                Number(select.value);


            // Find player in our PostgreSQL player list
            const player =
                allPlayers.find(
                    p => p.uid === playerId
                );


            if (player) {

                // Add player to current game
                players.push({

                    id: player.uid,

                    name: player.username,

                    color: player.color,

                    // Every player starts at 40
                    life: 40

                });

            }

        });


        // -----------------------------------------------------
        // Require at least 2 players
        // -----------------------------------------------------

        if (players.length < 2) {

            alert(
                "Choose at least 2 players."
            );

            return;
        }


        // -----------------------------------------------------
        // Hide setup screen
        // -----------------------------------------------------

        document
            .getElementById("game-setup")
            .style.display = "none";


        // -----------------------------------------------------
        // Show game screen
        // -----------------------------------------------------

        document
            .getElementById("game")
            .style.display = "block";


        // -----------------------------------------------------
        // Display players
        // -----------------------------------------------------

        renderPlayers();

    });


// =============================================================
// DISPLAY PLAYERS
// =============================================================

function renderPlayers() {


    const container =
        document.getElementById("players");


    // Remove old display
    container.innerHTML = "";


    // Create a box for every player
    players.forEach((player, index) => {


        const element =
            document.createElement("div");


        element.className =
            "player";


        // Use player's color from PostgreSQL
        element.style.setProperty(
            "--player-color",
            player.color
        );


        element.innerHTML = `

            <div class="player-name">
                ${player.name}
            </div>


            <div class="life">
                ${player.life}
            </div>


            <div class="buttons">


                <button
                    class="minus"
                    onclick="changeLife(${index}, -5)"
                >
                    -5
                </button>


                <button
                    class="plus"
                    onclick="changeLife(${index}, 5)"
                >
                    +5
                </button>


                <button
                    class="minus"
                    onclick="changeLife(${index}, -1)"
                >
                    -1
                </button>


                <button
                    class="plus"
                    onclick="changeLife(${index}, 1)"
                >
                    +1
                </button>


            </div>

        `;


        container.appendChild(element);

    });

}


// =============================================================
// CHANGE LIFE
// =============================================================

function changeLife(playerIndex, amount) {


    players[playerIndex].life += amount;


    renderPlayers();

}


// =============================================================
// RESET GAME
// =============================================================

document
    .getElementById("reset")
    .addEventListener("click", function() {


        players.forEach(player => {

            player.life = 40;

        });


        renderPlayers();

    });


</script>


</body>

</html>
